<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Main background gradient: deep indigo → vivid blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>

    <!-- Inner glow overlay -->
    <radialGradient id="glowGrad" cx="35%" cy="25%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- Bubble shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3730a3" flood-opacity="0.35"/>
    </filter>

    <!-- Dots glow -->
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="16" ry="16" fill="url(#bgGrad)"/>

  <!-- Soft inner glow -->
  <rect width="64" height="64" rx="16" ry="16" fill="url(#glowGrad)"/>

  <!-- Subtle grid texture lines -->
  <line x1="0" y1="32" x2="64" y2="32" stroke="white" stroke-opacity="0.04" stroke-width="0.5"/>
  <line x1="32" y1="0" x2="32" y2="64" stroke="white" stroke-opacity="0.04" stroke-width="0.5"/>

  <!-- Main chat bubble (large, primary) -->
  <path
    d="M10 13 C10 9.7 12.7 7 16 7 L42 7 C45.3 7 48 9.7 48 13 L48 31 C48 34.3 45.3 37 42 37 L26 37 L18 46 L18 37 C14.7 37 12 34.3 12 31 Z"
    fill="white"
    opacity="0.97"
    filter="url(#shadow)"
  />

  <!-- Small secondary bubble (bottom right, accent) -->
  <path
    d="M33 41 C33 39.3 34.3 38 36 38 L50 38 C51.7 38 53 39.3 53 41 L53 50 C53 51.7 51.7 53 50 53 L40 53 L36 57 L36 53 C34.3 53 33 51.7 33 50 Z"
    fill="white"
    opacity="0.35"
  />

  <!-- Three animated dots in main bubble -->
  <!-- Dot 1 -->
  <circle cx="22" cy="22" r="3.2" fill="url(#bgGrad)" filter="url(#dotGlow)"/>
  <!-- Dot 2 -->
  <circle cx="30" cy="22" r="3.2" fill="url(#bgGrad)" filter="url(#dotGlow)"/>
  <!-- Dot 3 -->
  <circle cx="38" cy="22" r="3.2" fill="url(#bgGrad)" filter="url(#dotGlow)"/>

  <!-- Subtle highlight line on top of icon (glass effect) -->
  <rect x="8" y="8" width="48" height="8" rx="8" fill="white" opacity="0.08"/>
</svg>